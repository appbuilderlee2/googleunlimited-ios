name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'GoogleUnlimited/**'
      - 'bridge/real_core_bridge.go'
      - 'project.yml'
      - '.github/workflows/build-ios.yml'
jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build pinned gotohp XCFramework
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/gotohp"
          cd "$RUNNER_TEMP/gotohp"
          git remote add origin https://github.com/xob0t/gotohp.git
          git fetch --depth 1 origin 97a5dc02db81f5571ce6b586f478600fcd44dd89
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "97a5dc02db81f5571ce6b586f478600fcd44dd89"
          mkdir -p iosbridge
          cp "$GITHUB_WORKSPACE/bridge/real_core_bridge.go" iosbridge/bridge.go
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          "$(go env GOPATH)/bin/gomobile" init
          go get -tool golang.org/x/mobile/cmd/gobind@latest
          go mod tidy
          mkdir -p "$GITHUB_WORKSPACE/Vendor"
          "$(go env GOPATH)/bin/gomobile" bind -target=ios -iosversion=17.0 -o "$GITHUB_WORKSPACE/Vendor/GotohpCore.xcframework" ./iosbridge
          test -d "$GITHUB_WORKSPACE/Vendor/GotohpCore.xcframework"
          find "$GITHUB_WORKSPACE/Vendor/GotohpCore.xcframework" -name '*.h' -maxdepth 6 -print
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Configure public iOS OAuth client
        env:
          GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          value = os.environ.get("GOOGLE_IOS_CLIENT_ID", "").strip()
          valid = value.endswith(".apps.googleusercontent.com")
          if valid:
              reversed_id = "com.googleusercontent.apps." + value.removesuffix(".apps.googleusercontent.com")
          else:
              value = "CONFIGURE_GOOGLE_IOS_CLIENT_ID"
              reversed_id = "oauth-not-configured"
          path = Path("project.yml")
          content = path.read_text()
          content = content.replace("__GOOGLE_CLIENT_ID__", value)
          content = content.replace("__GOOGLE_REVERSED_CLIENT_ID__", reversed_id)
          path.write_text(content)
          print("OAuth enabled:", valid)
          PY
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned device app
        run: |
          set -euo pipefail
          xcodebuild -project GoogleUnlimited.xcodeproj \
            -scheme GoogleUnlimited -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/GoogleUnlimited.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry "$GITHUB_WORKSPACE/GoogleUnlimited-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: googleunlimited-ios-unsigned-ipa
          path: GoogleUnlimited-unsigned.ipa
          retention-days: 14
