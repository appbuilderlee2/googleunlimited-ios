name: Audit gotohp iOS compatibility
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Fetch upstream source (no credentials)
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/xob0t/gotohp.git "$RUNNER_TEMP/gotohp"
          cd "$RUNNER_TEMP/gotohp"
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/gotohp-upstream-commit.txt"
          go version
          echo "Upstream Go version:"
          grep "^go " go.mod
          go env GOTOOLCHAIN
          go list -deps -e -json ./core > "$GITHUB_WORKSPACE/gotohp-backend-dependencies.json"
      - name: Check backend package compilation for iOS
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/gotohp"
          set +e
          export GOOS=ios GOARCH=arm64 CGO_ENABLED=1
          export SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          export CC="$(xcrun --find clang)"
          go build ./core 2>&1 | tee "$GITHUB_WORKSPACE/gotohp-ios-build.log"
          result=${PIPESTATUS[0]}
          echo "Go core compilation exit code: $result"
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gotohp-ios-compatibility-report
          path: |
            gotohp-upstream-commit.txt
            gotohp-backend-dependencies.json
            gotohp-ios-build.log
          retention-days: 14
