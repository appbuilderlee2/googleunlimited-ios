name: Build Gotohp Core XCFramework
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Fetch and pin source for this run
        run: |
          git init "$RUNNER_TEMP/gotohp"
          cd "$RUNNER_TEMP/gotohp"
          git remote add origin https://github.com/xob0t/gotohp.git
          git fetch --depth 1 origin 97a5dc02db81f5571ce6b586f478600fcd44dd89
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "97a5dc02db81f5571ce6b586f478600fcd44dd89"
          git rev-parse HEAD > "$GITHUB_WORKSPACE/gotohp-source-commit.txt"
          cp "$GITHUB_WORKSPACE/bridge/real_core_bridge.go" ./iosbridge.go
          mkdir -p iosbridge
          mv iosbridge.go iosbridge/bridge.go
      - name: Install GoMobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          "$(go env GOPATH)/bin/gomobile" init
      - name: Bind actual gotohp core package
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gotohp"
          "$(go env GOPATH)/bin/gomobile" bind -target=ios -iosversion=17.0 -o "$GITHUB_WORKSPACE/GotohpCore.xcframework" ./iosbridge
          test -d "$GITHUB_WORKSPACE/GotohpCore.xcframework"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gotohp-core-xcframework-experimental
          path: |
            GotohpCore.xcframework
            gotohp-source-commit.txt
          retention-days: 14
