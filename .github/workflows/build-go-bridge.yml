name: Build Go iOS Bridge (experiment)
on:
  workflow_dispatch:
  push:
    paths:
      - 'bridge/**'
      - '.github/workflows/build-go-bridge.yml'
jobs:
  bridge:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install GoMobile
        working-directory: bridge
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          "$(go env GOPATH)/bin/gomobile" init
      - name: Build iOS XCFramework
        working-directory: bridge
        run: |
          "$(go env GOPATH)/bin/gomobile" bind -target=ios -iosversion=17.0 -o "$RUNNER_TEMP/Bridge.xcframework" .
          test -d "$RUNNER_TEMP/Bridge.xcframework"
          find "$RUNNER_TEMP/Bridge.xcframework" -maxdepth 3 -type f | head -30
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-ios-xcframework-experimental
          path: ${{ runner.temp }}/Bridge.xcframework
          retention-days: 7
