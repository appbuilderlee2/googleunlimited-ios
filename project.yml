name: GoogleUnlimited
options:
  bundleIdPrefix: com.appbuilderlee2
  deploymentTarget:
    iOS: "17.0"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 9.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  GoogleUnlimited:
    type: application
    platform: iOS
    sources:
      - path: GoogleUnlimited
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      properties:
        GIDClientID: "__GOOGLE_CLIENT_ID__"
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - "__GOOGLE_REVERSED_CLIENT_ID__"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appbuilderlee2.googleunlimitedios
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "GoogleUnlimited"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "用於挑選相片及影片加入本機待上傳佇列。"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"
